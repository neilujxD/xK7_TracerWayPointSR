name: V2 quality checks

on:
  push:
    branches:
      - main
      - refactor/v2-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript and route model
        run: npm run verify
