name: Deploy GitHub Pages with V2 preview

on:
  push:
    branches:
      - main
      - refactor/v2-cleanup
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable site
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout V2 preview
        uses: actions/checkout@v4
        with:
          ref: refactor/v2-cleanup
          path: v2

      - name: Assemble Pages site
        run: |
          rm -rf stable/.git stable/.github
          rm -rf v2/.git v2/.github
          rm -rf stable/V2
          mkdir -p stable/V2
          cp -a v2/. stable/V2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stable

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
